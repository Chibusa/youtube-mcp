services:
  - type: web
    name: youtube-mcp
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MCP_SECRET
        generateValue: true
